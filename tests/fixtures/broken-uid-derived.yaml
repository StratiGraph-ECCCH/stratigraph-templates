# ROTTA: pretende di derivare l'UID dalla chiave naturale. In questo repository
# è rifiutato per scelta: la deduplicazione fra tool si fa riconoscendo un
# identificativo umano già presente, non facendo calcolare a due tool la stessa funzione.
# La definizione minima VALIDA: base delle rotture che le stanno accanto.
# Due campi, un paragrafo, un fronte e un retro.
template:
  id: broken-uid-derived
  standard:
    authority: TEST
    code: MIN
    version: "1"
    kind: field_model
    invented: true
    title: {it: "Minima"}
  source_language: it
  languages: [it]
  identity:
    human_key:
      fields: [numero]
      pattern: "MIN {numero}"
    uid:
      policy: minted_by_creator
      derive_from_human_key: true
  provenance:
    per_field: true
  paragraphs:
    - id: tutto
      labels: {it: "Tutto"}
      fields: [numero, copre, nota]
  fields:
    - id: numero
      labels: {it: "NUMERO"}
      type: identifier
      required: true
      graph: {verdict: identity}
    - id: copre
      labels: {it: "COPRE"}
      type: unit_ref_list
      graph: {verdict: edge, edge_type: overlies, direction: outgoing, target: stratigraphic_unit}
    - id: nota
      labels: {it: "NOTA"}
      type: longtext
      graph: {verdict: property, property_name: note}
  sheet:
    page: A4
    margins_mm: {top: 12, right: 12, bottom: 12, left: 12}
    sides:
      - id: recto
        labels: {it: "fronte"}
        rows:
          - h: 10
            cells:
              - {field: numero, w: 30}
              - {field: copre, w: 70}
      - id: verso
        labels: {it: "retro"}
        rows:
          - h: 40
            cells: [{field: nota, w: 100}]
