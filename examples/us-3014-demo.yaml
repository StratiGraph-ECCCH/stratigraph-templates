# ESEMPIO INVENTATO. Tutto quanto segue e' finto: il sito, l'ente, l'ufficio di
# tutela, le persone, i codici dei file, i reperti, le campionature e le date.
# Nessuna istituzione, nessuno scavo e nessuna persona reale sono coinvolti, e
# nessun valore proviene da un dataset di scavo. Vale come vale l'esempio
# spagnolo `ue-13-tarraco-demo.yaml`, che si dichiara allo stesso modo.
#
# A che serve. E' una US RICCA: dodici rapporti stratigrafici STRUTTURATI in
# dodici caselle invece che in un blob di testo, tutte le sezioni del modello
# ICCD US 2021 piene, e i termini presi dai moduli em-us-* come concetti. Serve
# a esercitare l'impaginazione fronte-retro, il rendering del form alle tre
# larghezze e il passaggio dei concetti dal vocabolario alla casella. Una
# scheda mezza vuota non proverebbe nessuna delle tre cose.
#
# I numeri sono plausibili di proposito — una scheda di prova con valori
# assurdi non mostra se il foglio regge — ma restano inventati: leggerli come
# dati archeologici sarebbe un errore.

