    descrizione: >-
      Strato a matrice sabbioso-limosa, di colore bruno chiaro, friabile, con inclusi abbondanti di
      laterizio frammentario disposti in giacitura caotica e localmente sub-orizzontale. Lo strato
      copre il piano pavimentale in cocciopesto US 3018 e si appoggia al paramento interno del muro
      US 3011; è tagliato dalla fossa US 3005 nell'angolo sud-est del vano. Potenza variabile fra
      0,18 e 0,42 m, maggiore lungo il muro nord.
    osservazioni: >-
      La concentrazione di tegole lungo il lato nord suggerisce che il crollo sia avvenuto per
      rotazione verso l'interno del vano. Campionata la matrice per analisi micromorfologiche
      (campione FN26/M/14).
    interpretazione: >-
      Crollo della copertura del vano 2 in seguito all'abbandono dell'edificio; l'assenza di
      materiali post-quattrocenteschi nella matrice e la giacitura del laterizio indicano un evento
      unico e rapido, non un degrado progressivo.

