  attribution: "Library of Congress, Network Development and MARC Standards Office"
  note: >
    Non c'è un relatore per chi scava o per chi compila una scheda di scavo
    (rcd Recordist è la registrazione audio e video); fld Field director è il
    più vicino al lavoro sul campo.
