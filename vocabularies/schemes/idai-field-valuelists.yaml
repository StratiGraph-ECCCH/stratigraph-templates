# I valuelist della configurazione di base di iDAI.field / Field Desktop (DAI).
# Dichiarato per poter ALLINEARE i nostri concetti, non per risolverne le
# etichette: il file non lo copiamo qui.
#
# ATTENZIONE: iDAI.field non conia URI per i valori. Un valore e' una chiave
# dentro un valuelist (`Layer-consistency-default` → `locker`). Gli
# identificatori qui sotto sono quindi LOCALIZZATORI costruiti da noi —
# `<uri><valuelistId>/<valore>` con il valore così com'è nel file (tedesco,
# percent-encoded) — fissati al commit letto. Non sono URI del DAI e non
# pretendono di esserlo: servono a dire DI QUALE valore parla l'allineamento.
scheme:
  id: idai-field-valuelists
  authority: "Deutsches Archäologisches Institut (DAI)"
  origin: external
  labels:
    en: "iDAI.field default valuelists"
    it: "Valuelist di base di iDAI.field"
    de: "iDAI.field Standard-Wertelisten"
  status: declared
  uri: "https://github.com/dainst/idai-field/blob/4b5c1e2c3c499d4bd125d0eda61cc6f5c94ffcd4/core/config/Library/Valuelists/Valuelists.json#"
  license: "Apache-2.0"
  attribution: "Deutsches Archäologisches Institut — iDAI.field (github.com/dainst/idai-field), core/config/Library, commit 4b5c1e2 (2026-09-24)"
  note: >
    Letti il 2026-09-27: Forms.json/Categories.json (categoria Layer: consistency →
    Layer-consistency-default, layerClassification → Layer-layerClassification-default;
    categoria Feature: color → colors-default-1) e Valuelists/Valuelists.json con le
    etichette in Language.default.it.json / .en.json. Layer non ha un campo di
    stato di conservazione né di affidabilità: lo stato di conservazione si
    allinea, con cautela, a Building-condition-default.
