# Il modello ICCD US 2021 prescrive un termine controllato per questa casella,
# ma l'ICCD non ha (ancora) pubblicato uno schema SKOS per i modelli DA CAMPO:
# gli strumenti terminologici in RDF coprono le schede di CATALOGO (RA, SI...).
# Quindi lo schema è DICHIARATO e non risolvibile.
#
# Finché l'ICCD non pubblica, risponde per lui un modulo NOSTRO (`provisional`,
# SPEC §3.2, decisione di E.D. del 27 settembre 2026): i campi continuano a citare
# questo schema — la norma è questa — e si risolvono con quello. Il giorno in cui
# esce lo SKOS: `resolve:` qui, un allineamento em-us-* → iccd-us-* in
# vocabularies/alignments/, e `provisional` si toglie.
scheme:
  id: iccd-us-stato-conservazione
  authority: ICCD
  labels:
    it: "Termini per «STATO DI CONSERVAZIONE» (scheda US da campo)"
    en: "Terms for «State of preservation» (US field model)"
  status: declared
  license: "CC BY-SA 4.0 (modello US 2021) — vocabolario non ancora pubblicato in SKOS"
  attribution: "MiC — ICCD"
  provisional: em-us-stato-conservazione
  note: "Nessun binding_thesId: quello lo danno le normative di catalogo in XSD, non i modelli da campo."
