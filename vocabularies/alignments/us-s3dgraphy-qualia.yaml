# Termini della scheda US ↔ i valori delle qualia a cui la definizione li
# lega (affidabilita → certainty_level, stato_conservazione →
# conservation_state, em_qualia_types.json 1.6.1). Quattro gradi PyArchInit
# contro sei EM per la certezza: `possible` e `speculative` restano senza
# corrispondente, e `insufficiente` (PyArchInit) non ha un posto evidente
# fra i cinque valori di conservation_state. closeMatch ovunque: sono scale
# diverse di autori diversi, e la corrispondenza la decide E.D.
