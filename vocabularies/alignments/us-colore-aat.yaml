# Colori della scheda US ↔ Getty AAT. Gli id sono stati letti dallo SPARQL
# di vocab.getty.edu il 2026-09-27 (prefLabelGVP esatta), non a memoria.
# Solo i colori: per DEFINIZIONE, CONSISTENZA, STATO DI CONSERVAZIONE e
# AFFIDABILITÀ la ricerca non ha trovato un'equivalenza evidente (AAT ha
# `friability` 300209172 come PROPRIETÀ, non come valore; nessun `fill`,
# `cut`, `destruction layer` archeologico) e un allineamento forzato è peggio
# di nessuno. Le sfumature (chiaro/scuro) non si allineano: stanno sotto il
# colore base con skos:broader nel modulo, e AAT non ha quei concetti.
