# Termini della scheda US ↔ valuelist di base di iDAI.field (commit 4b5c1e2).
# Confronto a lato, non fonte: i nostri termini vengono da PyArchInit.
# Gli identificatori iDAI sono localizzatori costruiti (v. lo schema).
# Sono proposte: la parola tedesca e la sua etichetta italiana di iDAI
# sono state lette insieme, e dove divergono lo dice la nota.
#
# 2026-10-26: il bersaglio non e' piu' lo schema-ombrello `idai-field-valuelists`
# (dichiarato, non risolvibile) ma UNO SCHEMA PER VALUELIST, risolvibile dal
# checkout di iDAI.field al commit fissato (`idai-field-<valuelist>`): stessi
# localizzatori, e ora la lente ICCD ↔ DAI legge le etichette dell'altra parte.
# Da qui in giu' anche gli allineamenti che servono alla scheda DAI
# (`dai-idaifield-layer-2026`): v. la sezione in fondo.
